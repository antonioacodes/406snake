<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISTEMA 406 — Nokia 3D Test</title>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c100d;--panel:#151b16;--lcd:#aabd87;--ink:#172015;--line:#334036;--accent:#b8d987}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#223329,var(--bg) 55%);color:#e5ecdf;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.shell{width:min(1180px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.top h1{margin:0;font-size:clamp(20px,4vw,34px);letter-spacing:.08em}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:99px;color:var(--accent)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.viewer{position:relative;min-height:680px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#080a08}.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#080a08;z-index:2;color:var(--accent)}.loading.hide{display:none}.panel{padding:16px;background:linear-gradient(160deg,#192119,var(--panel));border:1px solid var(--line);border-radius:18px}.lcd{padding:10px;background:var(--lcd);color:var(--ink);border:6px solid #56664f;box-shadow:inset 0 2px 8px #0005}.lcd canvas{width:100%;display:block;image-rendering:pixelated}.row{display:flex;justify-content:space-between;margin:10px 0;font-weight:bold}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.controls button,.actions button,select{min-height:42px;border:1px solid #526154;border-radius:9px;background:#263228;color:#e5ecdf;font:inherit;font-weight:bold;cursor:pointer}.controls button:hover,.actions button:hover{background:var(--accent);color:var(--ink)}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-top:16px}.field label{display:block;color:#aab7a8;margin-bottom:6px}.field select{width:100%;padding:7px}.status{min-height:88px;margin-top:12px;padding:10px;background:#0b0f0c;border:1px solid var(--line);border-radius:9px;color:#aab7a8;font-size:12px;white-space:pre-wrap}.note{margin-top:12px;color:#889487;font-size:11px}@media(max-width:820px){.grid{grid-template-columns:1fr}.viewer{min-height:58vh}.panel{order:-1}}
</style>
</head>
<body><main class="shell">
 <header class="top"><h1>SISTEMA 406 / 3D LAB</h1><span class="badge">EXPERIMENTO</span></header>
 <div class="grid">
  <section class="viewer"><div id="loading" class="loading">CARREGANDO NOKIA 3D…</div><iframe id="api-frame" title="Nokia 3310 3D" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe></section>
  <aside class="panel">
   <div class="lcd"><div class="row"><span>SISTEMA</span><span id="score">000</span></div><canvas id="game" width="252" height="168"></canvas></div>
   <div class="controls"><button class="up" data-dir="UP">2 ▲</button><button class="left" data-dir="LEFT">4 ◀</button><button class="down" data-dir="DOWN">8 ▼</button><button class="right" data-dir="RIGHT">6 ▶</button></div>
   <div class="actions"><button id="start">5 INICIAR/PAUSAR</button><button id="sound">SOM ON</button></div>
   <div class="field"><label for="materials">Material da tela 3D</label><select id="materials"><option>aguardando modelo…</option></select></div>
   <div id="status" class="status">Inicializando Viewer API…</div>
   <p class="note">Se a detecção automática escolher o material errado, selecione o LCD na lista. Clique nas teclas do modelo para verificar se são objetos separados.</p>
  </aside>
 </div>
</main>
<script>
(()=>{'use strict';
const UID='ff7c87c59f10466abe76b481ad03b418',canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),statusEl=document.querySelector('#status'),select=document.querySelector('#materials');
const C=18,R=12,S=14,V={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]},O={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};let snake=[],food,dir='RIGHT',next='RIGHT',gameState='menu',score=0,timer,sound=true,audio,api,materials=[],nodes={},screenMaterial,textureUid,textureBusy=false;
const log=m=>statusEl.textContent=m;const tone=f=>{if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.stop(audio.currentTime+.07)};
function spawn(){let p;do p={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)};while(snake.some(v=>v.x===p.x&&v.y===p.y));return p}function reset(){snake=[{x:8,y:6},{x:7,y:6},{x:6,y:6}];food=spawn();dir=next='RIGHT';score=0;scoreEl.textContent='000';gameState='play';clearInterval(timer);timer=setInterval(tick,165);tone(500);draw()}
function move(d){if(gameState==='play'&&d!==O[next])next=d}function pause(){if(gameState==='menu'||gameState==='over')return reset();gameState=gameState==='pause'?'play':'pause';draw()}
function tick(){if(gameState!=='play')return;dir=next;const v=V[dir],h={x:snake[0].x+v[0],y:snake[0].y+v[1]};if(h.x<0||h.x>=C||h.y<0||h.y>=R||snake.some(s=>s.x===h.x&&s.y===h.y)){gameState='over';clearInterval(timer);tone(100);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=String(score).padStart(3,'0');food=spawn();tone(850)}else snake.pop();draw()}
function draw(){ctx.fillStyle='#aabd87';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#172015';ctx.lineWidth=2;ctx.strokeRect(1,1,canvas.width-2,canvas.height-2);ctx.fillStyle='#172015';snake.forEach((p,i)=>ctx.fillRect(p.x*S+2,p.y*S+2,S-(i?4:3),S-(i?4:3)));if(food)ctx.fillRect(food.x*S+4,food.y*S+4,6,6);ctx.font='bold 16px monospace';ctx.textAlign='center';if(gameState!=='play'){ctx.fillStyle='#aabd87dd';ctx.fillRect(30,58,192,52);ctx.fillStyle='#172015';ctx.fillText(gameState==='over'?'FIM DE JOGO':gameState==='pause'?'PAUSADO':'5 PARA INICIAR',126,89)}syncTexture()}
function applyMaterial(m){screenMaterial=m;if(!textureUid||!m)return;let changed=false;['AlbedoPBR','DiffusePBR','DiffuseColor','EmitColor'].forEach(name=>{const ch=m.channels[name];if(!ch)return;ch.enable=true;ch.color=[1,1,1];ch.factor=1;ch.texture={uid:textureUid};changed=true});if(!changed){log('Material sem canal de cor compatível.');return}api.setMaterial(m,()=>log('Tela aplicada em: '+m.name+'\nClique numa tecla 3D para inspecionar.'))}
function syncTexture(){if(!api||textureBusy)return;const url=canvas.toDataURL('image/png');textureBusy=true;if(!textureUid)api.addTexture(url,(e,id)=>{textureBusy=false;if(e)return log('Não foi possível criar a textura dinâmica.');textureUid=id;applyMaterial(screenMaterial)});else api.updateTexture(url,textureUid,()=>textureBusy=false)}
function fillMaterials(list){materials=list;select.innerHTML='';list.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.name||('material '+i);select.append(o)});const preferred=list.findIndex(m=>/screen|display|lcd|glass|monitor/i.test(m.name||''));select.value=String(preferred>=0?preferred:0);applyMaterial(list[Number(select.value)])}
select.addEventListener('change',()=>applyMaterial(materials[Number(select.value)]));document.querySelector('.controls').addEventListener('click',e=>{const b=e.target.closest('[data-dir]');if(b)move(b.dataset.dir)});document.querySelector('#start').onclick=pause;document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='SOM '+(sound?'ON':'OFF');tone(600)};
document.addEventListener('keydown',e=>{const k={ArrowUp:'UP','2':'UP',w:'UP',ArrowLeft:'LEFT','4':'LEFT',a:'LEFT',ArrowRight:'RIGHT','6':'RIGHT',d:'RIGHT',ArrowDown:'DOWN','8':'DOWN',s:'DOWN'};if(k[e.key]){e.preventDefault();move(k[e.key])}else if(e.key===' '||e.key==='5'){e.preventDefault();pause()}});
const client=new Sketchfab('1.12.1',document.querySelector('#api-frame'));client.init(UID,{success(a){api=a;a.start(()=>a.addEventListener('viewerready',()=>{document.querySelector('#loading').classList.add('hide');a.getNodeMap((_,map)=>{nodes=map||{}});a.getMaterialList((err,list)=>{if(err||!list?.length)return log('Modelo carregado, mas materiais não foram listados.');fillMaterials(list);draw()});a.addEventListener('click',info=>{if(!info.instanceID)return;const node=nodes[info.instanceID];const name=node?.name||('objeto '+info.instanceID);log('Clique 3D: '+name+'\nID: '+info.instanceID+(info.material?'\nMaterial: '+info.material.name:''));const m=name.match(/(?:key|button|btn|tecla)?[_ .-]*([24568])\b/i);if(m){if(m[1]==='5')pause();else move({2:'UP',4:'LEFT',6:'RIGHT',8:'DOWN'}[m[1]])}},{pick:'fast'})}))},error(){document.querySelector('#loading').textContent='FALHA AO CARREGAR O MODELO';log('O Sketchfab recusou ou não conseguiu carregar o modelo.')}});draw();
})();
</script></body></html>
