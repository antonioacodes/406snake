<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>406 SYSTEM — Quarto Interativo</title>
<style>
:root{color-scheme:dark;--ink:#ede9dc;--red:#7d1824;--glass:#080a0bd9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{background:#080908;color:var(--ink);font-family:"Courier New",monospace}
button{font:inherit}.room{position:relative;width:100vw;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 52% 35%,#555144 0 8%,#292922 34%,#0e100e 76%,#030403 100%)}
.wall{position:absolute;inset:0 0 32%;background:linear-gradient(90deg,#141714cc,#39392f 48%,#171916cc),repeating-linear-gradient(0deg,transparent 0 42px,#0002 43px 44px);z-index:-3}.wall:after{content:"406";position:absolute;left:7%;top:12%;font:900 clamp(60px,14vw,210px)/1 Arial;color:#ffffff05;transform:rotate(-7deg)}
.floor{position:absolute;inset:63% -10% -20%;background:linear-gradient(#151613,#050605 70%);transform:perspective(500px) rotateX(56deg);transform-origin:top;z-index:-2}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11%,#0008 11.3% 11.6%),repeating-linear-gradient(0deg,transparent 0 70px,#0008 72px 74px);opacity:.5}
.desk{position:absolute;left:50%;bottom:3%;width:min(86vw,1050px);height:34%;transform:translateX(-50%);background:linear-gradient(100deg,#39271c,#6a4932 44%,#2b1d15);clip-path:polygon(2% 0,98% 0,100% 18%,96% 22%,94% 100%,88% 100%,87% 23%,13% 23%,12% 100%,6% 100%,5% 22%,0 18%);filter:drop-shadow(0 20px 25px #000c);z-index:1}.desk:after{content:"";position:absolute;inset:0 0 78%;background:linear-gradient(#8a6546,#402b1e);box-shadow:inset 0 3px #c69a6b55}
.object{position:absolute;z-index:2;border:0;color:inherit;cursor:pointer;background:none;padding:0;transition:transform .25s,filter .25s}.object:hover,.object:focus-visible{transform:translateY(-8px) scale(1.035);filter:drop-shadow(0 0 18px #e8f7b366)}.object:focus-visible{outline:2px solid #dce9a8;outline-offset:8px}
.phone{left:24%;bottom:27%;width:clamp(74px,9vw,126px);height:clamp(150px,19vw,260px);border-radius:28% 28% 24% 24%;background:linear-gradient(90deg,#252b39,#858c9b 12%,#30364b 22% 78%,#aab0b7 88%,#222936);box-shadow:inset 0 0 18px #000,0 18px 20px #000a;transform:rotate(-8deg)}.phone:hover,.phone:focus-visible{transform:rotate(-4deg) translateY(-8px) scale(1.04)}.phone:before{content:"406SYSTEM";position:absolute;left:20%;right:20%;top:12%;font:bold clamp(5px,.62vw,8px)/1 Arial;background:#0b0d0b;color:#ddd;padding:3px 0}.phone:after{content:"SNAKE\A  ▶ JOGAR";white-space:pre;position:absolute;left:17%;right:17%;top:23%;height:27%;display:grid;place-items:center;background:#a8c878;color:#17200f;border:5px solid #252a32;border-radius:10%;font:bold clamp(7px,.8vw,11px)/1.7 monospace}
.laptop{right:22%;bottom:26%;width:clamp(210px,30vw,420px);height:clamp(145px,21vw,285px)}.laptop .screen{position:absolute;inset:0 5% 13%;border:8px solid #191b1c;border-radius:10px;background:radial-gradient(circle at 72% 20%,#8a172e,#17101f 46%,#050608);box-shadow:0 12px 28px #000c,inset 0 0 0 2px #555}.laptop .screen:before{content:"406 OS";position:absolute;inset:8% 0 auto;text-align:center;font-weight:bold;letter-spacing:.2em}.laptop .screen:after{content:"CLIQUE PARA INICIAR";position:absolute;inset:auto 0 12%;text-align:center;font-size:clamp(7px,.8vw,11px);opacity:.7}.laptop .base{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(#777,#242526);clip-path:polygon(6% 0,94% 0,100% 72%,94% 100%,6% 100%,0 72%);border-radius:0 0 12px 12px}
.hint{position:absolute;left:50%;bottom:2%;z-index:4;transform:translateX(-50%);margin:0;background:#070908b8;border:1px solid #ffffff21;border-radius:99px;padding:9px 14px;font-size:clamp(9px,1vw,12px);white-space:nowrap;backdrop-filter:blur(10px)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(10px,3vw,38px);background:#020302e8;backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:.3s}.modal.open{opacity:1;visibility:visible}.panel{position:relative;width:min(1180px,96vw);height:min(820px,92svh);overflow:hidden;background:#070908;border:1px solid #ffffff29;border-radius:22px;box-shadow:0 30px 90px #000}.panel iframe{width:100%;height:100%;border:0;background:#090b09}.close{position:absolute;right:12px;top:12px;z-index:3;width:42px;height:42px;border:1px solid #fff5;border-radius:50%;background:#111c;color:white;cursor:pointer}.close:hover{background:var(--red)}
.os{height:100%;background:linear-gradient(135deg,#140c18,#431221 55%,#08080a);overflow:hidden}.menubar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#090909bb;backdrop-filter:blur(16px);font-size:12px}.desktop-icon{margin:28px;width:74px;text-align:center;font-size:11px}.desktop-icon i{display:block;width:54px;height:46px;margin:auto auto 6px;border-radius:8px;background:linear-gradient(135deg,#9a263c,#2b1324);box-shadow:inset 0 0 0 1px #fff3}.welcome{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center}.welcome b{display:block;font-size:clamp(32px,7vw,90px);letter-spacing:-.08em}.welcome span{opacity:.6}.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;padding:10px;background:#ffffff12;border:1px solid #fff2;border-radius:18px;backdrop-filter:blur(18px)}.dock i{width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,#ddd,#555)}
@media(max-width:680px){.room{min-height:430px}.desk{width:112vw;height:36%;bottom:1%}.phone{left:13%;bottom:28%;width:82px;height:168px}.laptop{right:4%;bottom:29%;width:225px;height:155px}.hint{bottom:1%;max-width:94vw;white-space:normal;text-align:center}.panel{width:100vw;height:100svh;border-radius:0}.modal{padding:0}.close{top:max(10px,env(safe-area-inset-top));right:10px}.laptop .screen{border-width:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="room" aria-label="Quarto interativo 406 SYSTEM">
  <div class="wall"></div><div class="floor"></div><div class="desk"></div>
  <button class="object phone" data-open="game" aria-label="Abrir jogo Snake no telefone"></button>
  <button class="object laptop" data-open="os" aria-label="Ligar computador 406 OS"><span class="screen"></span><span class="base"></span></button>
  <p class="hint">Explore a mesa · toque no telefone ou no computador</p>
</main>
<section class="modal" id="game-modal" role="dialog" aria-modal="true" aria-label="Jogo Snake">
  <div class="panel"><button class="close" aria-label="Fechar">×</button><iframe id="game-frame" title="406 Snake"></iframe></div>
</section>
<section class="modal" id="os-modal" role="dialog" aria-modal="true" aria-label="406 OS">
  <div class="panel"><button class="close" aria-label="Desligar">×</button><div class="os"><header class="menubar"><b>● 406 OS</b><span id="clock"></span></header><div class="desktop-icon"><i></i>ARQUIVOS 406</div><div class="welcome"><b>406</b><span>SISTEMA OPERACIONAL — PROTÓTIPO</span></div><footer class="dock"><i></i><i></i><i></i><i></i></footer></div></div>
</section>
<script>
(()=>{const modals={game:document.querySelector('#game-modal'),os:document.querySelector('#os-modal')},frame=document.querySelector('#game-frame');let active=null,lastTrigger=null;function open(name,trigger){lastTrigger=trigger;active=modals[name];if(name==='game'&&!frame.src)frame.src=location.pathname.endsWith('/room.html')?'./':'figma-snake.html';active.classList.add('open');active.querySelector('.close').focus()}function close(){if(!active)return;active.classList.remove('open');if(active===modals.game)frame.contentWindow?.postMessage({type:'406-pause'},'*');active=null;lastTrigger?.focus()}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open,b)));document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',close));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m)close()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});const tick=()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000)})();
</script>
</body>
</html>
