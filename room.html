<script>
(()=>{'use strict';const music=document.querySelector('#room-music'),ring=document.querySelector('#phone-ring'),volume=document.querySelector('#volume'),readout=document.querySelector('.volume-readout'),soundButton=document.querySelector('.sound-toggle');let sound=true,active=null,lastTrigger=null;music.volume=.24;ring.volume=.08;const startMusic=()=>sound&&music.play().catch(()=>{});const startAmbient=()=>{startMusic();sound&&ring.play().catch(()=>{})};document.addEventListener('pointerdown',startAmbient,{once:true});volume.addEventListener('input',()=>{const value=Number(volume.value);music.volume=value/100;readout.textContent=value;sound=value>0;soundButton.textContent='SOM '+(sound?'ON':'OFF');startMusic()});soundButton.addEventListener('click',()=>{sound=!sound;soundButton.textContent='SOM '+(sound?'ON':'OFF');sound?startAmbient():(music.pause(),ring.pause())});const modals={game:document.querySelector('#game-modal'),os:document.querySelector('#os-modal'),paint:document.querySelector('#paint-modal')},frame=document.querySelector('#game-frame');function open(name,trigger){lastTrigger=trigger;active=modals[name];if(name==='game'){if(!frame.src)frame.src=location.pathname.endsWith('/room.html')?'./?embed=room':'figma-snake.html?embed=room';ring.pause()}active.classList.add('open');active.querySelector('.close').focus();if(name==='paint')sizeCanvas()}function close(){if(!active)return;const wasGame=active===modals.game;active.classList.remove('open');active=null;if(wasGame&&sound)ring.play().catch(()=>{});lastTrigger?.focus()}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open,b)));document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',close));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m)close()}));document.addEventListener('keydown',e=>e.key==='Escape'&&close());const clock=()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});clock();setInterval(clock,1000);
const canvas=document.querySelector('#paint'),ctx=canvas.getContext('2d'),wall=document.querySelector('.wall');let painting=false,color='#ba1830',last=null;function sizeCanvas(){const r=wall.getBoundingClientRect(),ratio=Math.min(devicePixelRatio,2);if(canvas.width===Math.round(r.width*ratio)&&canvas.height===Math.round(r.height*ratio))return;canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)}function spray(e){if(!painting)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ctx.fillStyle=color;for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,d=Math.random()*18;ctx.globalAlpha=Math.random()*.38+.12;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.random()*3+1,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(last){ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke()}last={x,y};wall.classList.add('used')}canvas.addEventListener('pointerdown',e=>{painting=true;last=null;canvas.setPointerCapture(e.pointerId);spray(e)});canvas.addEventListener('pointermove',spray);canvas.addEventListener('pointerup',()=>{painting=false;last=null});document.querySelectorAll('.color').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.color.active').classList.remove('active');b.classList.add('active');color=b.dataset.color}));document.querySelector('.clear').addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);wall.classList.remove('used')});window.addEventListener('resize',()=>active===modals.paint&&sizeCanvas())})();
