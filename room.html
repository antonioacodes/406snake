<script>
(()=>{
  const canvas=document.querySelector('#canvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d'); let painting=false, activePointer=null, paintColor='#e42527';
  const dot=(event)=>{
    const rect=canvas.getBoundingClientRect(), x=event.clientX-rect.left, y=event.clientY-rect.top;
    ctx.save();ctx.fillStyle=paintColor;
    for(let i=0;i<18;i++){ctx.globalAlpha=.2+Math.random()*.45;ctx.beginPath();ctx.arc(x+(Math.random()-.5)*28,y+(Math.random()-.5)*28,Math.random()*4+1,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  };
  canvas.addEventListener('pointerdown',event=>{event.preventDefault();event.stopImmediatePropagation();painting=true;activePointer=event.pointerId;canvas.setPointerCapture?.(event.pointerId);dot(event);},{capture:true,passive:false});
  canvas.addEventListener('pointermove',event=>{if(!painting||event.pointerId!==activePointer)return;event.preventDefault();event.stopImmediatePropagation();dot(event);},{capture:true,passive:false});
  const finish=event=>{if(event.pointerId===activePointer){painting=false;activePointer=null;}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>canvas.addEventListener(type,finish,{capture:true}));

@media(max-width:1024px),(hover:none) and (pointer:coarse){
#computer.open{padding:0!important;align-items:stretch!important}
#computer .window{width:100%!important;height:100dvh!important;max-height:100dvh!important;min-height:0!important;margin:0!important;border-radius:0!important;padding:40px 0 0!important;overflow:hidden!important}
#computer .window>iframe{display:block;width:100%!important;height:100%!important;border:0}
#computer .computer-power{top:4px!important;right:max(8px,env(safe-area-inset-right))!important;height:30px!important;font-size:11px!important}
}
</style><style>
.hud{flex-direction:column;border-radius:12px;width:240px;max-width:calc(100vw - 24px);padding:10px;box-sizing:border-box}
.hud:focus-within,.hud.pinned{opacity:1;pointer-events:auto}
.beat-controls{display:flex;align-items:center;gap:8px;width:100%}
.beat-controls button{flex:0 0 40px;min-height:40px;border:1px solid #ffffff44;border-radius:7px;background:#211b18;color:#fff;cursor:pointer;touch-action:manipulation}
#beat-title{flex:1;min-width:0;font:11px/1.4 Arial;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.beat-volume{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:32px}
@media(hover:none),(pointer:coarse){.hud{position:fixed!important;left:50%!important;top:auto!important;bottom:max(12px,env(safe-area-inset-bottom))!important;transform:translateX(-50%);z-index:19}}
</style><script>
(()=>{
const beat=document.querySelector('#beat'),transition=document.querySelector('#beat-transition'),hud=document.querySelector('.hud'),apollo=document.querySelector('.apollo'),title=document.querySelector('#beat-title');
let tracks=[{src:'media/room-beat-127.wav',title:'406 — Beat 127'}],index=0,requested=false,failures=0,changing=false;
beat.loop=false;
const choose=(next,play)=>{index=(next+tracks.length)%tracks.length;beat.pause();beat.src=tracks[index].src;beat.load();title.textContent=tracks[index].title;if(play)beat.play().catch(()=>{title.textContent=tracks[index].title+' · toque para ouvir'})};
const transitionTo=(next)=>{
  if(changing)return;
  changing=true;beat.pause();
  let done=false;
  const continueToBeat=()=>{if(done)return;done=true;transition.pause();transition.removeEventListener('ended',continueToBeat);choose(next,true);changing=false};
  transition.currentTime=0;
  transition.addEventListener('ended',continueToBeat,{once:true});
  transition.play().then(()=>setTimeout(continueToBeat,7000)).catch(continueToBeat);
};
const next=delta=>{requested=true;failures=0;transitionTo(index+delta)};
document.querySelector('#beat-prev').addEventListener('click',()=>next(-1));
document.querySelector('#beat-next').addEventListener('click',()=>next(1));
beat.addEventListener('ended',()=>{failures=0;transitionTo(index+1)});
beat.addEventListener('error',()=>{failures++;if(failures<tracks.length)choose(index+1,requested);else title.textContent='Não foi possível carregar os beats'});
apollo.setAttribute('tabindex','0');apollo.setAttribute('role','button');apollo.setAttribute('aria-label','Mostrar controles dos beats');apollo.setAttribute('aria-expanded','false');
const toggle=()=>{const open=hud.classList.toggle('pinned');apollo.setAttribute('aria-expanded',String(open))};
apollo.addEventListener('click',toggle);apollo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
document.addEventListener('pointerdown',event=>{requested=true;if(!hud.contains(event.target)&&event.target!==apollo){hud.classList.remove('pinned');apollo.setAttribute('aria-expanded','false')}});
fetch('beats.php',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('playlist');return r.json()}).then(list=>{
const valid=Array.isArray(list)?list.filter(t=>typeof t.src==='string'&&/^media\//.test(t.src)&&typeof t.title==='string'):[];
if(!valid.length)return;
for(let i=valid.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[valid[i],valid[j]]=[valid[j],valid[i]]}
const resume=requested||!beat.paused;tracks=valid;choose(0,resume);
}).catch(()=>{});
})();
</script>
