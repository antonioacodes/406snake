 .object{position:absolute}</style><script>document.addEventListener('DOMContentLoaded',()=>{const beat=document.querySelector('#beat');beat.loop=false;beat.addEventListener('ended',()=>{beat.currentTime=0;beat.play().catch(()=>{})})})</script><style>.room{width:100vw;height:100vh;min-height:520px;aspect-ratio:auto}.object{filter:drop-shadow(0 10px 14px #0008)}.object:hover{transform:none;filter:brightness(1.06) drop-shadow(0 10px 16px #0009)}.shirt{top:calc(51.8% - 20px)}.hud{right:auto;bottom:auto;left:34.4%;top:57.6%;opacity:0;pointer-events:none;transition:opacity .2s ease;background:#080606dd;border-color:#ffffff44}.hud.show,.hud:hover{opacity:1;pointer-events:auto}.apollo,.clock{pointer-events:auto;cursor:pointer}.apollo{filter:drop-shadow(0 10px 14px #0008)}@media(max-width:700px) and (orientation:portrait){body:after{content:'GIRE O TELEFONE\A PARA ENTRAR NA SALA';white-space:pre;position:fixed;inset:0;z-index:1000;display:grid;place-content:center;text-align:center;background:#080405;color:#fff;font:700 16px/1.7 monospace;letter-spacing:.08em}.room{visibility:hidden}.modal{display:none!important}}</style></head><body><main class="room" aria-label="Quarto 406 em chamas">

<script>(()=>{const beat=document.querySelector('#beat'),volume=document.querySelector('#volume'),readout=document.querySelector('#readout');let audio,source,low,high,fireStarted=false;beat.volume=.24;function setup(){if(audio)return;audio=new AudioContext();source=audio.createMediaElementSource(beat);low=audio.createBiquadFilter();high=audio.createBiquadFilter();low.type='highpass';low.frequency.value=30;high.type='lowpass';high.frequency.value=20000;source.connect(low).connect(high).connect(audio.destination)}function fire(){return;if(fireStarted)return;fireStarted=true;const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.min(1,i/(audio.sampleRate*.1));const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();noise.buffer=buffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=820;gain.gain.value=.028;noise.connect(filter).connect(gain).connect(audio.destination);noise.start()}function start(){setup();audio.resume();beat.play().catch(()=>{});fire()}addEventListener('pointerdown',start,{once:true});addEventListener('keydown',start,{once:true});volume.addEventListener('input',()=>{beat.volume=volume.value/100;readout.textContent=volume.value});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{setup();if(b.dataset.filter==='high')high.frequency.value=high.frequency.value>10000?2200:20000;else low.frequency.value=low.frequency.value<100?700:30}));document.querySelectorAll('.disabled-generated-hover').forEach(o=>o.addEventListener('mouseenter',()=>{if(!audio)return;const osc=audio.createOscillator(),g=audio.createGain();osc.frequency.value=420;g.gain.value=.018;osc.connect(g).connect(audio.destination);osc.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);osc.stop(audio.currentTime+.07)}));const modals=document.querySelectorAll('.modal');document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.open;if(id==='snake'){location.href='./';return}document.querySelector('#'+id).classList.add('open')}));document.querySelectorAll('.close').forEach(b=>b.addEventListener('click',()=>b.closest('.modal').classList.remove('open')));const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let down=false,color='#e42527';function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}resize();addEventListener('resize',resize);canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointermove',e=>{if(!down)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ctx.fillStyle=color;for(let i=0;i<16;i++){ctx.globalAlpha=.18+Math.random()*.35;ctx.beginPath();ctx.arc(x+(Math.random()-.5)*30,y+(Math.random()-.5)*30,Math.random()*4+1,0,7);ctx.fill()}ctx.globalAlpha=1});document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>color=b.dataset.color));document.querySelector('#clear').addEventListener('click',()=>ctx.clearRect(0,0,canvas.width,canvas.height))})();</script><script>(()=>{const apollo=document.querySelector('.apollo'),hud=document.querySelector('.hud'),imac=document.querySelector('.imac'),computer=document.querySelector('#computer');let hide;apollo.addEventListener('mouseenter',()=>{clearTimeout(hide);hud.classList.add('show')});apollo.addEventListener('mouseleave',()=>{hide=setTimeout(()=>{if(!hud.matches(':hover'))hud.classList.remove('show')},180)});hud.addEventListener('mouseleave',()=>hud.classList.remove('show'));imac.addEventListener('click',e=>{e.stopImmediatePropagation();computer.innerHTML='<div class="window" style="width:min(1200px,96vw);height:min(760px,94vh)"><button class="close">×</button><iframe title="406OS" src="macos-406/index.html?v=406os-20260908" style="border:0;width:100%;height:100%"></iframe></div>';computer.classList.add('open');computer.querySelector('.close').addEventListener('click',()=>computer.classList.remove('open'))},true)})();</script><script>(()=>{const apollo=document.querySelector('.apollo'),hud=document.querySelector('.hud'),imac=document.querySelector('.imac'),computer=document.querySelector('#computer'),ring=document.querySelector('#phone-ring');let hide;ring.volume=.06;const startRing=()=>ring.play().catch(()=>{});addEventListener('pointerdown',startRing,{once:true});addEventListener('keydown',startRing,{once:true});apollo.addEventListener('mouseenter',()=>{clearTimeout(hide);hud.classList.add('show')});apollo.addEventListener('mouseleave',()=>{hide=setTimeout(()=>{if(!hud.matches(':hover'))hud.classList.remove('show')},180)});hud.addEventListener('mouseleave',()=>hud.classList.remove('show'));imac.addEventListener('click',e=>{e.stopImmediatePropagation();computer.innerHTML='<div class="window" style="width:min(1200px,96vw);height:min(760px,94vh)"><button class="close">×</button><iframe title="406OS" src="macos-406/index.html?v=406os-20260908" style="border:0;width:100%;height:100%"></iframe></div>';computer.classList.add('open');computer.querySelector('.close').addEventListener('click',()=>computer.classList.remove('open'))},true)})();</script><script>(()=>{const beat=document.querySelector('#beat'),slider=document.querySelector('#volume'),readout=document.querySelector('#readout');slider.max=100;slider.value=Math.round(beat.volume*100);const setBeat=()=>{beat.volume=Math.max(0,Math.min(1,Number(slider.value)/100));readout.textContent=slider.value};slider.addEventListener('input',setBeat);slider.addEventListener('change',setBeat);document.querySelectorAll('.disabled-added-hover').forEach(el=>el.addEventListener('pointerenter',()=>{}))})();</script><script>(()=>{const spray=document.querySelector('.spray'),paint=document.querySelector('#paint'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');const openPaint=e=>{e.stopImmediatePropagation();paint.classList.add('open');requestAnimationFrame(()=>{const ratio=Math.min(devicePixelRatio,2),width=canvas.clientWidth,height=canvas.clientHeight;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)})};spray.addEventListener('click',openPaint,true);spray.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPaint(e)}},true)})();</script><script>document.querySelectorAll('[data-open="snake"]').forEach(button=>button.addEventListener('click',event=>{event.stopImmediatePropagation();location.href='./?room=1'},true))</script><script>(()=>{const fire=document.querySelector('#fire-track');fire.volume=.144;const startFire=()=>fire.play().catch(()=>{});addEventListener('pointerdown',startFire,{once:true});addEventListener('keydown',startFire,{once:true});const bind=(selector,id)=>{const el=document.querySelector(selector),sound=document.querySelector(id);if(!el||!sound)return;sound.volume=.8;el.addEventListener('pointerenter',()=>{sound.pause();sound.currentTime=0;sound.play().catch(()=>{})})};bind('.spray','#hover-spray');bind('.shirt','#hover-shirt');bind('.sign','#hover-sign')})();</script><script>(()=>{const ring=document.querySelector('#phone-ring'),button=document.querySelector('.phone-mute');button.addEventListener('click',event=>{event.stopPropagation();ring.muted=!ring.muted;button.setAttribute('aria-pressed',String(ring.muted));button.textContent=ring.muted?'SOM OFF':'MUTE';button.setAttribute('aria-label',ring.muted?'Ativar vibração do telefone':'Silenciar vibração do telefone')})})();</script></body></html>
