illStyle=i%2?SCREEN:INK;ctx.globalAlpha=.24;ctx.fillRect(8+Math.random()*30,30+Math.random()*50,120+Math.random()*50,2+Math.random()*3)}ctx.globalAlpha=1;text('406',74,31);text('SYSTEM ERROR',104,8);text('AGUARDE...',118,7)}function drawMenu(){ctx.fillStyle=SCREEN;ctx.fillRect(0,0,196,139);ctx.fillStyle=INK;ctx.globalAlpha=.09;for(let x=8;x<196;x+=12)ctx.fillRect(x,0,1,139);for(let y=7;y<139;y+=12)ctx.fillRect(0,y,196,1);ctx.globalAlpha=1;text('406 SNAKE',22,18);const pix=(x,y,w=7,h=7)=>ctx.fillRect(x,y,w,h);ctx.fillStyle=INK;[[53,72],[60,72],[67,72],[74,72],[81,72],[88,72],[95,72],[102,72],[109,72],[116,72],[123,72],[130,72],[137,72],[144,72],[151,72],[151,65],[151,58],[151,51],[144,51],[137,51],[130,51],[123,51],[116,51],[109,51],[102,51],[95,51],[88,51],[81,51],[74,51],[67,51],[60,51],[53,51],[53,58],[53,65]].forEach(p=>pix(...p));pix(61,44,14,7);pix(61,37,7,7);pix(75,44,7,14);pix(116,44,14,7);pix(123,37,7,7);pix(130,44,7,14);ctx.fillStyle=SCREEN;pix(60,57,3,3);pix(70,57,3,3);pix(126,57,3,3);pix(136,57,3,3);ctx.fillStyle=INK;ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('○',98,101);if(targetVisible)text('NEW GAME',116,12);text('PRESSIONE 5',130,7)}
function draw(){if(state==='menu'){drawMenu();return}ctx.fillStyle=SCREEN;ctx.fillRect(0,0,196,139);const glow=ctx.createRadialGradient(98,72,5,98,72,120);glow.addColorStop(0,'#d0ec96');glow.addColorStop(1,'#9dc35f');ctx.globalAlpha=.34;ctx.fillStyle=glow;ctx.fillRect(0,17,196,122);ctx.globalAlpha=1;ctx.fillStyle=HEADER;ctx.fillRect(0,0,196,17);ctx.fillStyle=INK;ctx.font='bold 8.5px monospace';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(3,'0'),12,9);ctx.textAlign='right';ctx.fillText('HI '+String(high).padStart(3,'0'),184,9);ctx.globalAlpha=.1;ctx.strokeStyle=INK;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,BOARD_Y);ctx.lineTo(x*CELL,BOARD_Y+ROWS*CELL);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,BOARD_Y+y*CELL);ctx.lineTo(195,BOARD_Y+y*CELL);ctx.stroke()}ctx.globalAlpha=1;if(state==='glitch')draw406();else{drawSnake();drawTarget()}if(state!=='play'&&state!=='glitch'){ctx.fillStyle='#b7d978e8';ctx.fillRect(22,53,152,47);text(state==='pause'?'PAUSADO':'FIM DE JOGO',69,12);text(state==='over'?'5 NOVO JOGO':'PRESSIONE 5',87,8)}}
const lcd=document.querySelector('.lcd');let swipeStart;lcd.addEventListener('pointerdown',e=>{swipeStart={x:e.clientX,y:e.clientY}});lcd.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<14)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'RIGHT':'LEFT'):(dy>0?'DOWN':'UP'))});document.querySelector('.stage').addEventListener('pointerdown',e=>{const b=e.target.closest('.hotspot');if(!b)return;b.classList.add('pressed');if(b.dataset.dir)move(b.dataset.dir);else action()});document.addEventListener('pointerup',()=>document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed')));document.addEventListener('keydown',e=>{const map={ArrowUp:'UP',w:'UP',W:'UP','2':'UP',ArrowLeft:'LEFT',a:'LEFT',A:'LEFT','4':'LEFT',ArrowRight:'RIGHT',d:'RIGHT',D:'RIGHT','6':'RIGHT',ArrowDown:'DOWN',s:'DOWN',S:'DOWN','8':'DOWN'};if(map[e.key]){e.preventDefault();move(map[e.key])}else if(e.key==='5'||e.key===' '||e.key==='Enter'){e.preventDefault();action()}else if(e.key.toLowerCase()==='z'){document.querySelector('#zoom').click()}});document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='SOM '+(sound?'ON':'OFF');beep(640)};document.querySelector('#zoom').onclick=e=>{const active=document.body.classList.toggle('zoom-mode');e.currentTarget.textContent=active?'VER TELEFONE':'AMPLIAR TELA';e.currentTarget.setAttribute('aria-pressed',String(active))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';draw()}});setInterval(()=>{targetVisible=!targetVisible;if(targetVisible)target=target==='money'?'rat':'money';draw()},360);snake=[{x:7,y:4},{x:6,y:4},{x:5,y:4}];food=spawn();draw();if(location.hash==='#406')trigger406()})();
