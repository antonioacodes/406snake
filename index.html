<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),music=document.querySelector('#music');const COLS=15,ROWS=9,CELL=13,BOARD_Y=18,SCREEN='#b7d978',HEADER='#9fbe62',INK='#18250f',V={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]},OP={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};let snake=[],food={x:0,y:0},direction='RIGHT',next='RIGHT',state='menu',score=0,high=Number(localStorage.getItem('406system-high')||0),target='money',targetVisible=true,timer,sound=true,audio;ctx.scale(2,2);
const beep=(freq,d=.06)=>{if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)};
function spawn(){let p;do p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}function reset(){snake=[{x:7,y:4},{x:6,y:4},{x:5,y:4}];food=spawn();direction=next='RIGHT';score=0;state='play';clearInterval(timer);timer=setInterval(tick,165);beep(520);draw()}
function move(d){if(state==='play'&&d!==OP[next])next=d}function action(){if(state==='menu'||state==='over')return reset();state=state==='pause'?'play':'pause';beep(state==='play'?520:280);draw()}
function tick(){if(state!=='play')return;direction=next;const v=V[direction],h={x:snake[0].x+v[0],y:snake[0].y+v[1]};if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){state='over';clearInterval(timer);beep(110,.2);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;if(score>high){high=score;localStorage.setItem('406system-high',String(high))}food=spawn();beep(880)}else snake.pop();draw()}
function text(t,y,size=11){ctx.fillStyle=INK;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,98,y)}function center(p){return{x:p.x*CELL+CELL/2,y:BOARD_Y+p.y*CELL+CELL/2}}function drawSnake(){ctx.fillStyle=INK;for(let i=0;i<snake.length-1;i++){const a=center(snake[i]),b=center(snake[i+1]);ctx.fillRect(Math.min(a.x,b.x)-3,Math.min(a.y,b.y)-3,Math.abs(a.x-b.x)+7,Math.abs(a.y-b.y)+7)}snake.forEach((p,i)=>{const c=center(p),near=snake[i+1]||snake[i-1],vertical=near&&near.x===p.x;if(i===0){ctx.fillRect(c.x-6,c.y-6,12,12);if(direction==='RIGHT')ctx.fillRect(c.x+5,c.y-4,3,8);if(direction==='LEFT')ctx.fillRect(c.x-8,c.y-4,3,8);if(direction==='DOWN')ctx.fillRect(c.x-4,c.y+5,8,3);if(direction==='UP')ctx.fillRect(c.x-4,c.y-8,8,3);ctx.fillStyle=SCREEN;if(direction==='RIGHT'||direction==='LEFT'){const ex=direction==='RIGHT'?c.x+1:c.x-3;ctx.fillRect(ex,c.y-4,2,2);ctx.fillRect(ex,c.y+2,2,2)}else{const ey=direction==='DOWN'?c.y+1:c.y-3;ctx.fillRect(c.x-4,ey,2,2);ctx.fillRect(c.x+2,ey,2,2)}ctx.fillStyle=INK}else if(i===snake.length-1)ctx.fillRect(c.x-4,c.y-4,8,8);else if(vertical)ctx.fillRect(c.x-4,c.y-6,9,12);else ctx.fillRect(c.x-6,c.y-4,12,9)})}function drawTarget(){if(!targetVisible)return;const c=center(food);ctx.fillStyle=INK;if(target==='money'){ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',c.x,c.y+1)}else{ctx.fillRect(c.x-5,c.y-3,8,6);ctx.fillRect(c.x+2,c.y-4,5,5);ctx.fillRect(c.x+2,c.y-6,2,2);ctx.fillRect(c.x-8,c.y,4,2);ctx.fillStyle=SCREEN;ctx.fillRect(c.x+5,c.y-3,1,1)}}function draw(){ctx.fillStyle=SCREEN;ctx.fillRect(0,0,196,139);const glow=ctx.createRadialGradient(98,72,5,98,72,120);glow.addColorStop(0,'#d0ec96');glow.addColorStop(1,'#9dc35f');ctx.globalAlpha=.34;ctx.fillStyle=glow;ctx.fillRect(0,17,196,122);ctx.globalAlpha=1;ctx.fillStyle=HEADER;ctx.fillRect(0,0,196,17);ctx.fillStyle=INK;ctx.font='bold 8.5px monospace';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(3,'0'),12,9);ctx.textAlign='right';ctx.fillText('HI '+String(high).padStart(3,'0'),184,9);ctx.globalAlpha=.1;ctx.strokeStyle=INK;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,BOARD_Y);ctx.lineTo(x*CELL,BOARD_Y+ROWS*CELL);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,BOARD_Y+y*CELL);ctx.lineTo(195,BOARD_Y+y*CELL);ctx.stroke()}ctx.globalAlpha=1;drawSnake();drawTarget();if(state!=='play'){ctx.fillStyle='#b7d978e8';ctx.fillRect(22,53,152,47);text(state==='menu'?'406 SNAKE':state==='pause'?'PAUSADO':'FIM DE JOGO',69,12);text(state==='over'?'5 NOVO JOGO':'PRESSIONE 5',87,8)}}
document.querySelector('.stage').addEventListener('pointerdown',e=>{const b=e.target.closest('.hotspot');if(!b)return;b.classList.add('pressed');if(b.dataset.dir)move(b.dataset.dir);else action()});document.addEventListener('pointerup',()=>document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed')));document.addEventListener('keydown',e=>{const map={ArrowUp:'UP',w:'UP',W:'UP','2':'UP',ArrowLeft:'LEFT',a:'LEFT',A:'LEFT','4':'LEFT',ArrowRight:'RIGHT',d:'RIGHT',D:'RIGHT','6':'RIGHT',ArrowDown:'DOWN',s:'DOWN',S:'DOWN','8':'DOWN'};if(map[e.key]){e.preventDefault();move(map[e.key])}else if(e.key==='5'||e.key===' '||e.key==='Enter'){e.preventDefault();action()}else if(e.key.toLowerCase()==='z'){document.querySelector('#zoom').click()}});document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='SOM '+(sound?'ON':'OFF');beep(640)};document.querySelector('#zoom').onclick=e=>{const active=document.body.classList.toggle('zoom-mode');e.currentTarget.textContent=active?'VER TELEFONE':'AMPLIAR TELA';e.currentTarget.setAttribute('aria-pressed',String(active))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';draw()}});setInterval(()=>{targetVisible=!targetVisible;if(targetVisible)target=target==='money'?'rat':'money';draw()},360);snake=[{x:7,y:4},{x:6,y:4},{x:5,y:4}];food=spawn();draw()})();
