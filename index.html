<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>406 SYSTEM — Snake</title>
<meta name="description" content="Snake jogável no mockup Nokia 406 SYSTEM.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#f9a6a6 0%,#f68a8a 25%,#f46f6f 50%,#f15353 75%,#ef3737 100%);font-family:"Courier New",monospace}.stage{position:relative;height:min(94vh,780px);aspect-ratio:269/624;filter:drop-shadow(0 24px 18px #75191966);user-select:none}.phone{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.lcd{position:absolute;left:13.55%;top:25.7%;width:73.9%;height:22.55%;border-radius:10%;overflow:hidden;transform:rotate(.05deg);background:#7ba77e}.lcd canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hotspot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}.hotspot:active,.hotspot.pressed{background:#ef373733;box-shadow:inset 0 0 0 2px #ef373388;transform:translateY(1px)}.key2{left:40.2%;top:66.9%;width:20.4%;height:5.15%}.key4{left:12.8%;top:72%;width:19%;height:5.5%}.key5{left:40.2%;top:74%;width:20.4%;height:5.2%}.key6{left:68.1%;top:71.8%;width:19%;height:5.7%}.key8{left:40.2%;top:81%;width:20.4%;height:5.2%}.sound{position:fixed;right:18px;top:18px;border:1px solid #ffffff77;background:#261f32cc;color:white;border-radius:99px;padding:9px 13px;font:700 11px/1 "Courier New",monospace;cursor:pointer;backdrop-filter:blur(8px)}.help{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);margin:0;padding:7px 11px;background:#261f32bb;color:#fff;border-radius:99px;font-size:10px;white-space:nowrap;backdrop-filter:blur(8px)}@media(max-width:520px){.stage{height:min(88vh,720px)}.help{bottom:5px;font-size:9px}.sound{right:8px;top:8px}}@media(max-height:650px) and (orientation:landscape){.stage{height:95vh}.help{left:10px;bottom:8px;transform:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Nokia 406 SYSTEM com jogo Snake">
 <img class="phone" src="data:image/png;base64,base64:invalidargumentoutputs/assets/nokia-figma.pngUsage:base64[-Ddh][-bnum][-iin_file][-oout_file]-b,--breakbreakencodedoutputupintolinesoflengthnum-D,-d,--decodedecodeinput-h,--helpdisplaythismessage-i,--inputinputfile(default:"-"forstdin)-o,--outputoutputfile(default:"-"forstdout)" alt="Mockup Nokia 406 SYSTEM criado no Figma">
 <div class="lcd"><canvas id="game" width="196" height="139" aria-label="Tela do jogo Snake"></canvas></div>
 <button class="hotspot key2" data-dir="UP" aria-label="Mover para cima"></button>
 <button class="hotspot key4" data-dir="LEFT" aria-label="Mover para esquerda"></button>
 <button class="hotspot key5" data-action="start" aria-label="Iniciar ou pausar"></button>
 <button class="hotspot key6" data-dir="RIGHT" aria-label="Mover para direita"></button>
 <button class="hotspot key8" data-dir="DOWN" aria-label="Mover para baixo"></button>
</main>
<button id="sound" class="sound" type="button">SOM ON</button>
<p class="help">2 4 6 8 movem · 5 inicia/pausa</p>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const COLS=14,ROWS=9,CELL=14,V={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]},OP={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};let snake=[],food={x:0,y:0},direction='RIGHT',next='RIGHT',state='menu',score=0,high=Number(localStorage.getItem('406system-high')||0),timer,sound=true,audio;
const beep=(freq,d=.06)=>{if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)};
function spawn(){let p;do p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}function reset(){snake=[{x:7,y:4},{x:6,y:4},{x:5,y:4}];food=spawn();direction=next='RIGHT';score=0;state='play';clearInterval(timer);timer=setInterval(tick,165);beep(520);draw()}
function move(d){if(state==='play'&&d!==OP[next])next=d}function action(){if(state==='menu'||state==='over')return reset();state=state==='pause'?'play':'pause';beep(state==='play'?520:280);draw()}
function tick(){if(state!=='play')return;direction=next;const v=V[direction],h={x:snake[0].x+v[0],y:snake[0].y+v[1]};if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){state='over';clearInterval(timer);beep(110,.2);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;if(score>high){high=score;localStorage.setItem('406system-high',String(high))}food=spawn();beep(880)}else snake.pop();draw()}
function text(t,y,size=11){ctx.fillStyle='#172015';ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,canvas.width/2,y)}function draw(){ctx.fillStyle='#83a987';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.globalAlpha=.08;ctx.strokeStyle='#172015';for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,126);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(196,y*CELL);ctx.stroke()}ctx.globalAlpha=1;ctx.fillStyle='#172015';snake.forEach((p,i)=>ctx.fillRect(p.x*CELL+2,p.y*CELL+2,CELL-(i?4:3),CELL-(i?4:3)));ctx.fillRect(food.x*CELL+5,food.y*CELL+5,5,5);ctx.fillStyle='#779b7b';ctx.fillRect(0,126,196,13);ctx.fillStyle='#172015';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText('SCORE '+String(score).padStart(3,'0'),4,135);ctx.textAlign='right';ctx.fillText('HI '+String(high).padStart(3,'0'),192,135);if(state!=='play'){ctx.fillStyle='#83a987e8';ctx.fillRect(22,40,152,47);text(state==='menu'?'406 SNAKE':state==='pause'?'PAUSADO':'FIM DE JOGO',56,12);text(state==='over'?'5 NOVO JOGO':'PRESSIONE 5',74,8)}}
document.querySelector('.stage').addEventListener('pointerdown',e=>{const b=e.target.closest('.hotspot');if(!b)return;b.classList.add('pressed');if(b.dataset.dir)move(b.dataset.dir);else action()});document.addEventListener('pointerup',()=>document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed')));document.addEventListener('keydown',e=>{const map={ArrowUp:'UP',w:'UP',W:'UP','2':'UP',ArrowLeft:'LEFT',a:'LEFT',A:'LEFT','4':'LEFT',ArrowRight:'RIGHT',d:'RIGHT',D:'RIGHT','6':'RIGHT',ArrowDown:'DOWN',s:'DOWN',S:'DOWN','8':'DOWN'};if(map[e.key]){e.preventDefault();move(map[e.key])}else if(e.key==='5'||e.key===' '||e.key==='Enter'){e.preventDefault();action()}});document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='SOM '+(sound?'ON':'OFF');beep(640)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';draw()}});snake=[{x:7,y:4},{x:6,y:4},{x:5,y:4}];food=spawn();draw()})();
</script>
</body></html>
